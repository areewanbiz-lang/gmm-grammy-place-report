<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMM Grammy Place - Interactive 3D Background</title>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Reset and Full-Viewport Setup for Google Sites Embed */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020617;
            background-image:
                radial-gradient(circle at 20% 0%, rgba(18, 167, 207, 0.22), transparent 55%),
                radial-gradient(circle at 90% 20%, rgba(61, 123, 255, 0.16), transparent 50%),
                radial-gradient(circle at 50% 95%, rgba(212, 154, 30, 0.08), transparent 50%);
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body:active {
            cursor: grabbing;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
            z-index: 1;
        }

        /* Subtle Floating Camera View Pills (Bottom-Right) — 5 views */
        .camera-pills {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            max-width: calc(100vw - 420px);
            pointer-events: auto;
        }

        .camera-pill {
            appearance: none;
            border: 1px solid rgba(111, 214, 238, 0.28);
            background: rgba(2, 6, 23, 0.68);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: rgba(226, 232, 240, 0.88);
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.03em;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .camera-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(111, 214, 238, 0.55);
            transition: all 0.25s ease;
        }

        .camera-pill:hover {
            border-color: rgba(111, 214, 238, 0.75);
            color: #ffffff;
            transform: translateY(-1px);
            background: rgba(15, 23, 42, 0.85);
        }

        .camera-pill.active {
            border-color: #f6cf6a;
            background: linear-gradient(135deg, rgba(18, 167, 207, 0.28), rgba(36, 83, 201, 0.32));
            color: #ffffff;
            box-shadow: 0 0 18px rgba(18, 167, 207, 0.32);
        }

        .camera-pill.active::before {
            background: #f6cf6a;
            box-shadow: 0 0 8px #f6cf6a;
        }

        /* Floating Layer Legend (Bottom-Left) — 6 items, click to show/hide */
        .layer-legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }

        .legend-item {
            appearance: none;
            border: none;
            background: transparent;
            color: rgba(203, 213, 225, 0.88);
            font-family: inherit;
            font-size: 13px;
            line-height: 1.35;
            text-align: left;
            padding: 3px 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        .legend-item:hover {
            background: rgba(111, 214, 238, 0.08);
            color: #ffffff;
        }

        .legend-item[aria-pressed="false"] {
            opacity: 0.38;
        }

        .legend-swatch {
            flex: 0 0 auto;
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .swatch-tower  { background: rgba(2, 6, 23, 0.6); border: 1.5px solid rgba(111, 214, 238, 0.55); }
        .swatch-ground { background: #22d3ee; }
        .swatch-b1     { background: #3b82f6; }
        .swatch-b2     { background: #10b981; }
        .swatch-b3     { background: #f59e0b; }
        .swatch-b4     { background: #8b5cf6; }

        /* Mid-size screens: move legend to top-left so it never collides with the pills */
        @media (max-width: 1024px) {
            .layer-legend {
                top: 16px;
                bottom: auto;
                left: 16px;
            }
            .camera-pills {
                max-width: calc(100vw - 40px);
            }
        }

        @media (max-width: 640px) {
            .camera-pills {
                bottom: 12px;
                right: 12px;
                left: 12px;
                justify-content: center;
                gap: 6px;
            }
            .camera-pill {
                font-size: 10.5px;
                padding: 6px 10px;
            }
            .layer-legend {
                top: 12px;
                left: 12px;
                padding: 10px 12px;
            }
            .legend-item {
                font-size: 11px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Fullscreen 3D Canvas -->
    <div id="webgl-canvas"></div>

    <!-- Layer Legend (6 items) -->
    <div class="layer-legend" role="group" aria-label="Model Layers">
        <button type="button" class="legend-item" data-layer="tower" aria-pressed="true">
            <span class="legend-swatch swatch-tower"></span>Main Tower (Floors 1–43, Above Ground)
        </button>
        <button type="button" class="legend-item" data-layer="ground" aria-pressed="true">
            <span class="legend-swatch swatch-ground"></span>Street Level Ground Line (Y = 0)
        </button>
        <button type="button" class="legend-item" data-layer="b1" aria-pressed="true">
            <span class="legend-swatch swatch-b1"></span>B1 Block: Underground Car Park
        </button>
        <button type="button" class="legend-item" data-layer="b2" aria-pressed="true">
            <span class="legend-swatch swatch-b2"></span>B2 Block: Shop &amp; Car Park
        </button>
        <button type="button" class="legend-item" data-layer="b3" aria-pressed="true">
            <span class="legend-swatch swatch-b3"></span>B3 Block: Car Park
        </button>
        <button type="button" class="legend-item" data-layer="b4" aria-pressed="true">
            <span class="legend-swatch swatch-b4"></span>B4 Block: Car Park (Deepest Subgrade)
        </button>
    </div>

    <!-- Subtle Floating Camera View Switcher Pills (5 views) -->
    <div class="camera-pills" role="toolbar" aria-label="3D Camera Views">
        <button type="button" class="camera-pill" data-view="asoke">Asoke Front (Sukhumvit 21)</button>
        <button type="button" class="camera-pill" data-view="sukhumvit23">Sukhumvit 23 Rear</button>
        <button type="button" class="camera-pill" data-view="basement">Underground View (B1–B4)</button>
        <button type="button" class="camera-pill" data-view="helipad">Helipad View</button>
        <button type="button" class="camera-pill active" data-view="orbit">Auto Orbit</button>
    </div>

    <script>
        window.onload = function () {
            const container = document.getElementById('webgl-canvas');

            // ==========================================
            // 1. SIGNATURE COLOR PALETTE DEFINITIONS
            // ==========================================
            const PALETTE = {
                navyBg: 0x020617,
                cyanPrimary: 0x12a7cf,
                cyanBright: 0x6fd6ee,
                royalLight: 0x6f93ff,
                royalDeep: 0x2453c9,
                goldBright: 0xf6cf6a,
                goldRich: 0xd49a1e,
                ruby: 0xff5c7c,
                precastLight: 0xe8e2d5,
                precastWarm: 0xd5ccb9,
                curtainGlass: 0x0a2e46,
                curtainDeep: 0x061a2e,
                // Basement layer colours (match legend swatches)
                b1Blue: 0x3b82f6,
                b1BlueEdge: 0x7fa2ff,
                b2Green: 0x10b981,
                b2GreenEdge: 0x5ee0a8,
                groundCyan: 0x22d3ee,
                b3Amber: 0xf59e0b,
                b3AmberEdge: 0xfcd34d,
                b4Violet: 0x8b5cf6,
                b4VioletEdge: 0xc4b5fd
            };

            const CRYSTAL_THEMES = [
                { core: PALETTE.cyanPrimary, edge: PALETTE.cyanBright, emissive: 0x083b4c },
                { core: PALETTE.royalDeep, edge: PALETTE.royalLight, emissive: 0x0d2159 },
                { core: PALETTE.goldRich, edge: PALETTE.goldBright, emissive: 0x422d05 },
                { core: PALETTE.ruby, edge: 0xff8da3, emissive: 0x4a0e1c }
            ];

            // ==========================================
            // 2. SCENE, CAMERA & RENDERER SETUP
            // ==========================================
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(PALETTE.navyBg, 0.0115);

            const camera = new THREE.PerspectiveCamera(
                52,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

            const renderer = new THREE.WebGLRenderer({
                alpha: true,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // ==========================================
            // 3. PROCEDURAL TEXTURE GENERATORS
            // ==========================================
            function createGlowTexture(colorHex) {
                const size = 128;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const color = new THREE.Color(colorHex);
                const r = Math.floor(color.r * 255);
                const g = Math.floor(color.g * 255);
                const b = Math.floor(color.b * 255);

                const gradient = ctx.createRadialGradient(
                    size / 2, size / 2, 0,
                    size / 2, size / 2, size / 2
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, 1)`);
                gradient.addColorStop(0.2, `rgba(${r}, ${g}, ${b}, 0.85)`);
                gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.28)`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                return new THREE.CanvasTexture(canvas);
            }

            // Procedural Curtain Wall Mullion & Window Bay Texture
            function createCurtainWallTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Deep reflective blue-cyan glass gradient
                const grad = ctx.createLinearGradient(0, 0, 512, 512);
                grad.addColorStop(0, '#072238');
                grad.addColorStop(0.5, '#0c3b59');
                grad.addColorStop(1, '#08263e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                // Subtle architectural window grid mullions
                const cols = 16;
                const rows = 16;
                const cellW = 512 / cols;
                const cellH = 512 / rows;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // Subtle interior ambient variation per pane
                        const rand = (Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;
                        if (Math.abs(rand) > 0.72) {
                            ctx.fillStyle = 'rgba(111, 214, 238, 0.14)';
                            ctx.fillRect(c * cellW + 2, r * cellH + 2, cellW - 4, cellH - 4);
                        } else if (Math.abs(rand) < 0.14) {
                            ctx.fillStyle = 'rgba(246, 207, 106, 0.12)';
                            ctx.fillRect(c * cellW + 2, r * cellH + 2, cellW - 4, cellH - 4);
                        }
                    }
                }

                // Vertical & horizontal aluminum mullions
                ctx.strokeStyle = 'rgba(111, 214, 238, 0.28)';
                ctx.lineWidth = 2;
                for (let i = 0; i <= cols; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellW, 0);
                    ctx.lineTo(i * cellW, 512);
                    ctx.stroke();
                }
                for (let j = 0; j <= rows; j++) {
                    ctx.beginPath();
                    ctx.moveTo(0, j * cellH);
                    ctx.lineTo(512, j * cellH);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            // Procedural Helipad 'H' Marking Texture
            function createHelipadTexture() {
                const size = 512;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const cx = size / 2;
                const cy = size / 2;

                // Dark metallic helipad deck surface
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(cx, cy, 248, 0, Math.PI * 2);
                ctx.fill();

                // Outer safety perimeter ring (Cyan glow)
                ctx.strokeStyle = '#6fd6ee';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(cx, cy, 232, 0, Math.PI * 2);
                ctx.stroke();

                // Dashed Gold Touchdown & Lift-Off (TLOF) Circle
                ctx.save();
                ctx.strokeStyle = '#f6cf6a';
                ctx.lineWidth = 14;
                ctx.setLineDash([28, 18]);
                ctx.beginPath();
                ctx.arc(cx, cy, 185, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // Inner aiming circle
                ctx.strokeStyle = 'rgba(18, 167, 207, 0.55)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(cx, cy, 135, 0, Math.PI * 2);
                ctx.stroke();

                // Bold Helipad 'H' in signature gold/white
                ctx.fillStyle = '#f6cf6a';
                const barW = 28;
                const hHeight = 160;
                const hWidth = 120;
                // Left vertical bar
                ctx.fillRect(cx - hWidth / 2, cy - hHeight / 2, barW, hHeight);
                // Right vertical bar
                ctx.fillRect(cx + hWidth / 2 - barW, cy - hHeight / 2, barW, hHeight);
                // Center crossbar
                ctx.fillRect(cx - hWidth / 2, cy - barW / 2, hWidth, barW);

                return new THREE.CanvasTexture(canvas);
            }

            // Floating 3D Text Label (used for B1–B4 tags)
            function createLabelSprite(text, colorCss) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = 'rgba(2, 6, 23, 0.72)';
                ctx.strokeStyle = colorCss;
                ctx.lineWidth = 4;
                const r = 28;
                ctx.beginPath();
                ctx.moveTo(r + 4, 4);
                ctx.lineTo(252 - r, 4);
                ctx.quadraticCurveTo(252, 4, 252, 4 + r);
                ctx.lineTo(252, 124 - r);
                ctx.quadraticCurveTo(252, 124, 252 - r, 124);
                ctx.lineTo(4 + r, 124);
                ctx.quadraticCurveTo(4, 124, 4, 124 - r);
                ctx.lineTo(4, 4 + r);
                ctx.quadraticCurveTo(4, 4, 4 + r, 4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = colorCss;
                ctx.font = 'bold 64px Inter, Segoe UI, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 128, 68);

                const sprite = new THREE.Sprite(
                    new THREE.SpriteMaterial({
                        map: new THREE.CanvasTexture(canvas),
                        transparent: true,
                        depthWrite: false
                    })
                );
                sprite.scale.set(2.4, 1.2, 1);
                return sprite;
            }

            // ==========================================
            // 4. LIGHTING SYSTEM
            // ==========================================
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.72);
            scene.add(ambientLight);

            const mainDirLight = new THREE.DirectionalLight(0xf8fafc, 1.15);
            mainDirLight.position.set(28, 42, 32);
            scene.add(mainDirLight);

            const backRimLight = new THREE.DirectionalLight(PALETTE.royalLight, 0.75);
            backRimLight.position.set(-25, 20, -30);
            scene.add(backRimLight);

            const cyanLight = new THREE.PointLight(PALETTE.cyanBright, 2.4, 90);
            cyanLight.position.set(18, 14, 20);
            scene.add(cyanLight);

            const royalLight = new THREE.PointLight(PALETTE.royalLight, 2.0, 90);
            royalLight.position.set(-22, -6, 16);
            scene.add(royalLight);

            const goldLight = new THREE.PointLight(PALETTE.goldBright, 2.1, 85);
            goldLight.position.set(0, 24, 14);
            scene.add(goldLight);

            const rubyLight = new THREE.PointLight(PALETTE.ruby, 1.4, 75);
            rubyLight.position.set(16, -12, -18);
            scene.add(rubyLight);

            // ==========================================
            // 5. DETAILED 43-STOREY GMM GRAMMY PLACE MODEL
            // ==========================================
            const buildingGroup = new THREE.Group();
            scene.add(buildingGroup);

            const TOTAL_FLOORS = 43;
            const FLOOR_HEIGHT = 0.54;
            const BASE_Y = -12.2; // Ground Level (Sukhumvit 21 / 23 grade)

            const curtainTexture = createCurtainWallTexture();

            // Shared Architectural Materials
            const precastMat = new THREE.MeshStandardMaterial({
                color: PALETTE.precastLight,
                roughness: 0.38,
                metalness: 0.18
            });

            const precastAccentMat = new THREE.MeshStandardMaterial({
                color: PALETTE.precastWarm,
                roughness: 0.42,
                metalness: 0.22
            });

            const curtainGlassMat = new THREE.MeshStandardMaterial({
                color: 0x0e4166,
                map: curtainTexture,
                roughness: 0.12,
                metalness: 0.88,
                emissive: 0x051d33,
                emissiveIntensity: 0.55
            });

            const darkMullionMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.25,
                metalness: 0.8
            });

            const highlightGoldFloorMat = new THREE.MeshBasicMaterial({
                color: PALETTE.goldBright,
                transparent: true,
                opacity: 0.92
            });

            const highlightCyanFloorMat = new THREE.MeshBasicMaterial({
                color: PALETTE.cyanBright,
                transparent: true,
                opacity: 0.9
            });

            const ambientFloorGlowMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.24
            });

            // Plinth / Site Master Pad between Sukhumvit 21 (+Z) and Sukhumvit 23 (-Z)
            const sitePlinthGeo = new THREE.BoxGeometry(16.5, 0.5, 14.5);
            const sitePlinthMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.6,
                metalness: 0.3
            });
            const sitePlinth = new THREE.Mesh(sitePlinthGeo, sitePlinthMat);
            sitePlinth.position.set(0, BASE_Y - 0.25, 0);
            buildingGroup.add(sitePlinth);

            const sitePlinthEdges = new THREE.LineSegments(
                new THREE.EdgesGeometry(sitePlinthGeo),
                new THREE.LineBasicMaterial({ color: PALETTE.cyanPrimary, transparent: true, opacity: 0.45 })
            );
            sitePlinth.add(sitePlinthEdges);

            // ------------------------------------------
            // 5A. PODIUM BASE (FLOORS 1 - 10: RETAIL & PARKING)
            // ------------------------------------------
            const podiumFloors = 10;
            const podiumHeight = podiumFloors * FLOOR_HEIGHT;
            const podiumW = 11.2;
            const podiumD = 8.4;

            // Core Podium Glass & Parking Volume
            const podiumCoreGeo = new THREE.BoxGeometry(podiumW - 0.3, podiumHeight, podiumD - 0.3);
            const podiumCoreMesh = new THREE.Mesh(podiumCoreGeo, curtainGlassMat);
            podiumCoreMesh.position.set(0, BASE_Y + podiumHeight / 2, 0.2);
            buildingGroup.add(podiumCoreMesh);

            // Grand Double-Height Ground Floor Asoke Retail/Lobby Atrium (Floors 1-2)
            const lobbyH = FLOOR_HEIGHT * 2.2;
            const lobbyGeo = new THREE.BoxGeometry(podiumW - 0.6, lobbyH, 1.4);
            const lobbyGlowMat = new THREE.MeshBasicMaterial({
                color: PALETTE.goldBright,
                transparent: true,
                opacity: 0.68
            });
            const lobbyMesh = new THREE.Mesh(lobbyGeo, lobbyGlowMat);
            lobbyMesh.position.set(0, BASE_Y + lobbyH / 2, podiumD / 2 - 0.4);
            buildingGroup.add(lobbyMesh);

            // Asoke Front Entrance Canopy (Facing Sukhumvit 21 on +Z)
            const frontCanopyGroup = new THREE.Group();
            const canopySlabGeo = new THREE.BoxGeometry(7.2, 0.18, 2.4);
            const canopySlab = new THREE.Mesh(canopySlabGeo, precastMat);
            canopySlab.position.set(0, BASE_Y + lobbyH, podiumD / 2 + 1.1);
            frontCanopyGroup.add(canopySlab);

            const canopyGlassGeo = new THREE.BoxGeometry(6.8, 0.08, 2.1);
            const canopyGlass = new THREE.Mesh(canopyGlassGeo, highlightCyanFloorMat);
            canopyGlass.position.set(0, BASE_Y + lobbyH - 0.08, podiumD / 2 + 1.1);
            frontCanopyGroup.add(canopyGlass);

            // Front Canopy Structural Columns
            [-3.0, -1.0, 1.0, 3.0].forEach((colX) => {
                const colGeo = new THREE.CylinderGeometry(0.12, 0.12, lobbyH, 12);
                const colMesh = new THREE.Mesh(colGeo, precastMat);
                colMesh.position.set(colX, BASE_Y + lobbyH / 2, podiumD / 2 + 1.9);
                frontCanopyGroup.add(colMesh);
            });
            buildingGroup.add(frontCanopyGroup);

            // Sukhumvit 23 Rear Podium Connection & Drop-Off Canopy (-Z)
            const rearCanopyGeo = new THREE.BoxGeometry(5.2, 0.16, 1.8);
            const rearCanopy = new THREE.Mesh(rearCanopyGeo, precastMat);
            rearCanopy.position.set(0, BASE_Y + FLOOR_HEIGHT * 1.8, -podiumD / 2 - 0.6);
            buildingGroup.add(rearCanopy);

            const rearLobbyGlow = new THREE.Mesh(
                new THREE.BoxGeometry(4.6, FLOOR_HEIGHT * 1.6, 0.5),
                highlightCyanFloorMat
            );
            rearLobbyGlow.position.set(0, BASE_Y + FLOOR_HEIGHT * 0.85, -podiumD / 2 + 0.1);
            buildingGroup.add(rearLobbyGlow);

            // ------------------------------------------
            // 5B. MAIN HIGH-RISE TOWER SHAFT & SETBACKS (FLOORS 11 - 43)
            // ------------------------------------------
            // Helper to determine exact floor plate dimensions for authentic stepped massing
            function getFloorDimensions(floorNum) {
                if (floorNum <= 10) {
                    return { w: podiumW, d: podiumD, zOffset: 0.2, bayW: 5.0, bayD: 0.55 };
                } else if (floorNum <= 33) {
                    // Main Tower Shaft (Floors 11-33)
                    return { w: 9.2, d: 5.6, zOffset: 0, bayW: 4.4, bayD: 0.65 };
                } else if (floorNum <= 39) {
                    // Upper Mid-Rise Setback (Floors 34-39)
                    return { w: 8.2, d: 5.2, zOffset: 0, bayW: 4.0, bayD: 0.55 };
                } else {
                    // Executive Crown Penthouse Setback (Floors 40-43)
                    return { w: 7.0, d: 4.6, zOffset: 0, bayW: 3.4, bayD: 0.45 };
                }
            }

            // Continuous Glass Curtain Wall Volumes for each Tower Tier
            const tierConfigs = [
                { startF: 11, endF: 33, w: 8.95, d: 5.35, bayW: 4.3, bayD: 0.6 },
                { startF: 34, endF: 39, w: 7.95, d: 4.95, bayW: 3.9, bayD: 0.5 },
                { startF: 40, endF: 43, w: 6.75, d: 4.35, bayW: 3.3, bayD: 0.4 }
            ];

            tierConfigs.forEach((tier) => {
                const numF = tier.endF - tier.startF + 1;
                const h = numF * FLOOR_HEIGHT;
                const centerY = BASE_Y + (tier.startF - 1) * FLOOR_HEIGHT + h / 2;

                // Main Rectangular Curtain Wall Core
                const coreGeo = new THREE.BoxGeometry(tier.w, h, tier.d);
                const coreMesh = new THREE.Mesh(coreGeo, curtainGlassMat);
                coreMesh.position.set(0, centerY, 0);
                buildingGroup.add(coreMesh);

                // Projecting Central Glass Bay (Front Asoke +Z & Rear Sukhumvit 23 -Z)
                const bayGeo = new THREE.BoxGeometry(tier.bayW, h, tier.d + tier.bayD * 2);
                const bayMesh = new THREE.Mesh(bayGeo, curtainGlassMat);
                bayMesh.position.set(0, centerY, 0);
                buildingGroup.add(bayMesh);

                // Subtle Cyan Edge Wireframe for Postmodern Curtain Definition
                const edgeMesh = new THREE.LineSegments(
                    new THREE.EdgesGeometry(bayGeo),
                    new THREE.LineBasicMaterial({ color: PALETTE.cyanBright, transparent: true, opacity: 0.35 })
                );
                bayMesh.add(edgeMesh);
            });

            // ------------------------------------------
            // 5C. 43 INDIVIDUAL FLOOR PLATES, SPANDREL BANDS & KEY HIGHLIGHT FLOORS
            // ------------------------------------------
            // Strategic Highlight Floors (25, 26, 30, 31 + Executive Sky Floors 42, 43)
            const goldHighlightFloors = new Set([25, 26, 42]);
            const cyanHighlightFloors = new Set([30, 31, 43]);
            const animatedFloorRings = [];

            for (let f = 1; f <= TOTAL_FLOORS; f++) {
                const floorBottomY = BASE_Y + (f - 1) * FLOOR_HEIGHT;
                const spandrelY = floorBottomY + FLOOR_HEIGHT - 0.08;
                const dims = getFloorDimensions(f);

                // 1) Postmodern Champagne Precast Concrete Spandrel Band at every floor
                const spandrelHeight = f === 10 || f === 33 || f === 39 || f === 43 ? 0.19 : 0.13;
                const spandrelGeo = new THREE.BoxGeometry(dims.w + 0.18, spandrelHeight, dims.d + 0.18);
                const spandrelMesh = new THREE.Mesh(
                    spandrelGeo,
                    f % 2 === 0 ? precastMat : precastAccentMat
                );
                spandrelMesh.position.set(0, spandrelY, dims.zOffset);
                buildingGroup.add(spandrelMesh);

                // Projecting Central Bay Spandrel Band (Front & Rear postmodern horizontal eyebrow)
                const baySpandrelGeo = new THREE.BoxGeometry(
                    dims.bayW + 0.2,
                    spandrelHeight,
                    dims.d + dims.bayD * 2 + 0.2
                );
                const baySpandrelMesh = new THREE.Mesh(baySpandrelGeo, precastMat);
                baySpandrelMesh.position.set(0, spandrelY, dims.zOffset);
                buildingGroup.add(baySpandrelMesh);

                // 2) Interior Illuminated Floor Plate Glow (All 43 Floors)
                const isGoldFloor = goldHighlightFloors.has(f);
                const isCyanFloor = cyanHighlightFloors.has(f);

                if (isGoldFloor || isCyanFloor) {
                    // High-impact full-floor illumination for strategic floors (25, 26, 30, 31, etc.)
                    const glowMat = isGoldFloor ? highlightGoldFloorMat : highlightCyanFloorMat;
                    const floorLightGeo = new THREE.BoxGeometry(
                        dims.w - 0.12,
                        FLOOR_HEIGHT * 0.68,
                        dims.d + dims.bayD * 1.7
                    );
                    const floorLightMesh = new THREE.Mesh(floorLightGeo, glowMat);
                    floorLightMesh.position.set(0, floorBottomY + FLOOR_HEIGHT * 0.44, dims.zOffset);
                    buildingGroup.add(floorLightMesh);

                    // Luminous perimeter frame around highlighted strategic floors
                    const ringEdges = new THREE.LineSegments(
                        new THREE.EdgesGeometry(
                            new THREE.BoxGeometry(dims.w + 0.28, FLOOR_HEIGHT * 0.76, dims.d + dims.bayD * 2 + 0.28)
                        ),
                        new THREE.LineBasicMaterial({
                            color: isGoldFloor ? PALETTE.goldBright : PALETTE.cyanBright,
                            transparent: true,
                            opacity: 0.95
                        })
                    );
                    ringEdges.position.set(0, floorBottomY + FLOOR_HEIGHT * 0.44, dims.zOffset);
                    buildingGroup.add(ringEdges);
                    animatedFloorRings.push({ mesh: ringEdges, baseOpacity: 0.85, phase: f * 0.5 });
                } else if (f > 2 && (f % 3 === 0 || f % 5 === 0)) {
                    // Subtle occupied office glow on alternating floors across the 43-storey stack
                    const subGlowGeo = new THREE.BoxGeometry(
                        dims.w - 0.35,
                        FLOOR_HEIGHT * 0.42,
                        dims.d - 0.2
                    );
                    const subGlowMesh = new THREE.Mesh(subGlowGeo, ambientFloorGlowMat);
                    subGlowMesh.position.set(0, floorBottomY + FLOOR_HEIGHT * 0.42, dims.zOffset);
                    buildingGroup.add(subGlowMesh);
                }
            }

            // ------------------------------------------
            // 5D. VERTICAL ARCHITECTURAL PILASTERS & ELEVATOR CORE LIGHT STRIPS
            // ------------------------------------------
            const mainTowerH = 29 * FLOOR_HEIGHT; // Floors 11 to 39
            const mainTowerCenterY = BASE_Y + 10 * FLOOR_HEIGHT + mainTowerH / 2;

            // Corner Precast Concrete Vertical Columns / Fins
            const cornerOffsets = [
                [-4.55, 2.75],
                [4.55, 2.75],
                [-4.55, -2.75],
                [4.55, -2.75],
                [-2.2, 3.08],
                [2.2, 3.08],
                [-2.2, -3.08],
                [2.2, -3.08]
            ];

            cornerOffsets.forEach(([cx, cz]) => {
                const finGeo = new THREE.BoxGeometry(0.32, mainTowerH, 0.32);
                const finMesh = new THREE.Mesh(finGeo, precastMat);
                finMesh.position.set(cx, mainTowerCenterY, cz);
                buildingGroup.add(finMesh);
            });

            // Vertical Elevator Core Light Strips (Front, Rear & Side Flanks)
            const fullTowerH = TOTAL_FLOORS * FLOOR_HEIGHT;
            const fullTowerCenterY = BASE_Y + fullTowerH / 2;

            const stripMatCyan = new THREE.MeshBasicMaterial({ color: PALETTE.cyanBright });
            const stripMatGold = new THREE.MeshBasicMaterial({ color: PALETTE.goldBright });

            // Front & Rear dual vertical light spines
            [-0.65, 0.65].forEach((sx, idx) => {
                const frontStrip = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, fullTowerH * 0.92, 0.08),
                    idx === 0 ? stripMatCyan : stripMatGold
                );
                frontStrip.position.set(sx, fullTowerCenterY + 0.6, 3.36);
                buildingGroup.add(frontStrip);

                const rearStrip = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, fullTowerH * 0.92, 0.08),
                    idx === 0 ? stripMatGold : stripMatCyan
                );
                rearStrip.position.set(sx, fullTowerCenterY + 0.6, -3.36);
                buildingGroup.add(rearStrip);
            });

            // East & West flank vertical elevator core light strips
            [-1, 1].forEach((dir) => {
                const sideStrip = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, mainTowerH, 0.45),
                    stripMatCyan
                );
                sideStrip.position.set(dir * 4.66, mainTowerCenterY, 0);
                buildingGroup.add(sideStrip);
            });

            // ------------------------------------------
            // 5E. STEPPED CROWN MECHANICAL PENTHOUSE & ROOFTOP HELIPAD
            // ------------------------------------------
            const roofBaseY = BASE_Y + TOTAL_FLOORS * FLOOR_HEIGHT; // ~ +11.02

            // Lower Mechanical Penthouse Tier
            const mechTier1Geo = new THREE.BoxGeometry(5.6, 1.05, 3.8);
            const mechTier1 = new THREE.Mesh(mechTier1Geo, precastMat);
            mechTier1.position.set(0, roofBaseY + 0.52, 0);
            buildingGroup.add(mechTier1);

            // Illuminated Crown Signage / Architectural Cove Band
            const crownBandGeo = new THREE.BoxGeometry(5.75, 0.24, 3.95);
            const crownBand = new THREE.Mesh(crownBandGeo, highlightGoldFloorMat);
            crownBand.position.set(0, roofBaseY + 0.82, 0);
            buildingGroup.add(crownBand);

            // Upper Octagonal Helipad Support Pedestal
            const mechTier2Geo = new THREE.CylinderGeometry(2.1, 2.45, 0.75, 8);
            const mechTier2 = new THREE.Mesh(mechTier2Geo, precastAccentMat);
            mechTier2.position.set(0, roofBaseY + 1.4, 0);
            buildingGroup.add(mechTier2);

            // Circular Rooftop Helipad Platform with Glowing 'H' & Beacons
            const helipadY = roofBaseY + 1.85;
            const helipadRadius = 2.65;
            const helipadTexture = createHelipadTexture();

            const helipadDiskGeo = new THREE.CylinderGeometry(helipadRadius, helipadRadius * 0.94, 0.18, 48);
            const helipadSideMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.3,
                metalness: 0.7
            });
            const helipadTopMat = new THREE.MeshBasicMaterial({
                map: helipadTexture
            });

            const helipadMesh = new THREE.Mesh(helipadDiskGeo, [
                helipadSideMat,
                helipadTopMat,
                helipadSideMat
            ]);
            helipadMesh.position.set(0, helipadY, 0);
            buildingGroup.add(helipadMesh);

            // Glowing Cyan Helipad Perimeter Ring
            const helipadRingGeo = new THREE.TorusGeometry(helipadRadius + 0.06, 0.045, 12, 64);
            const helipadRingMesh = new THREE.Mesh(
                helipadRingGeo,
                new THREE.MeshBasicMaterial({ color: PALETTE.cyanBright })
            );
            helipadRingMesh.rotation.x = Math.PI / 2;
            helipadRingMesh.position.set(0, helipadY + 0.06, 0);
            buildingGroup.add(helipadRingMesh);

            // 8 Perimeter Helipad Navigation & Aviation Beacons
            const helipadBeacons = [];
            const beaconGlowTex = createGlowTexture(PALETTE.ruby);
            const cyanBeaconTex = createGlowTexture(PALETTE.cyanBright);

            for (let b = 0; b < 8; b++) {
                const angle = (b / 8) * Math.PI * 2;
                const bx = Math.cos(angle) * (helipadRadius - 0.12);
                const bz = Math.sin(angle) * (helipadRadius - 0.12);
                const isRuby = b % 2 === 0;

                const bulbGeo = new THREE.SphereGeometry(0.09, 10, 10);
                const bulbMat = new THREE.MeshBasicMaterial({
                    color: isRuby ? PALETTE.ruby : PALETTE.cyanBright
                });
                const bulb = new THREE.Mesh(bulbGeo, bulbMat);
                bulb.position.set(bx, helipadY + 0.14, bz);
                buildingGroup.add(bulb);

                const haloSprite = new THREE.Sprite(
                    new THREE.SpriteMaterial({
                        map: isRuby ? beaconGlowTex : cyanBeaconTex,
                        transparent: true,
                        opacity: 0.85,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    })
                );
                haloSprite.scale.set(0.85, 0.85, 1);
                haloSprite.position.set(bx, helipadY + 0.18, bz);
                buildingGroup.add(haloSprite);

                helipadBeacons.push({ sprite: haloSprite, phase: b * 0.8, isRuby });
            }

            // Twin Broadcast / Aviation Obstruction Spires on Rear of Crown
            [-1.8, 1.8].forEach((spireX, idx) => {
                const spireH = 2.6;
                const spireGeo = new THREE.CylinderGeometry(0.03, 0.08, spireH, 8);
                const spireMesh = new THREE.Mesh(spireGeo, precastMat);
                spireMesh.position.set(spireX, roofBaseY + 1.0 + spireH / 2, -1.2);
                buildingGroup.add(spireMesh);

                const tipBeacon = new THREE.Sprite(
                    new THREE.SpriteMaterial({
                        map: beaconGlowTex,
                        transparent: true,
                        opacity: 0.95,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    })
                );
                tipBeacon.scale.set(1.1, 1.1, 1);
                tipBeacon.position.set(spireX, roofBaseY + 1.0 + spireH, -1.2);
                buildingGroup.add(tipBeacon);
                helipadBeacons.push({ sprite: tipBeacon, phase: idx * Math.PI, isRuby: true });
            });

            // ==========================================
            // 5F. STREET LEVEL GROUND LINE (Y = 0 DATUM)
            // ==========================================
            const groundGroup = new THREE.Group();
            scene.add(groundGroup);

            const GROUND_LINE_Y = BASE_Y - 0.46; // just beneath road decks & site plinth
            const SITE_W = 17.4;
            const SITE_D = 15.4;

            // Faint translucent street-level datum plane
            const groundPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(70, 70),
                new THREE.MeshBasicMaterial({
                    color: PALETTE.groundCyan,
                    transparent: true,
                    opacity: 0.05,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = GROUND_LINE_Y;
            groundGroup.add(groundPlane);

            // Bright site perimeter on the ground line
            const groundLineMat = new THREE.LineBasicMaterial({
                color: PALETTE.groundCyan,
                transparent: true,
                opacity: 0.95
            });
            const perimeterPts = [
                new THREE.Vector3(-SITE_W / 2, GROUND_LINE_Y, -SITE_D / 2),
                new THREE.Vector3(SITE_W / 2, GROUND_LINE_Y, -SITE_D / 2),
                new THREE.Vector3(SITE_W / 2, GROUND_LINE_Y, SITE_D / 2),
                new THREE.Vector3(-SITE_W / 2, GROUND_LINE_Y, SITE_D / 2)
            ];
            const groundPerimeter = new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(perimeterPts),
                groundLineMat
            );
            groundGroup.add(groundPerimeter);

            // Long glowing datum bars running along the street frontages
            const datumBarMat = new THREE.MeshBasicMaterial({
                color: PALETTE.groundCyan,
                transparent: true,
                opacity: 0.75
            });
            [-SITE_D / 2, SITE_D / 2].forEach((dz) => {
                const bar = new THREE.Mesh(new THREE.BoxGeometry(70, 0.05, 0.05), datumBarMat);
                bar.position.set(0, GROUND_LINE_Y, dz);
                groundGroup.add(bar);
            });

            // ==========================================
            // 5G. B1, B2, B3 & B4 UNDERGROUND BLOCKS
            // ==========================================
            const BASEMENT_H = 1.5;
            const BASEMENT_GAP = 0.12;
            const BASEMENT_W = 15.8;
            const BASEMENT_D = 13.8;
            const B1_TOP_Y = GROUND_LINE_Y - 0.08;
            const B2_TOP_Y = B1_TOP_Y - BASEMENT_H - BASEMENT_GAP;
            const B3_TOP_Y = B2_TOP_Y - BASEMENT_H - BASEMENT_GAP; // assumed level: passenger lifts skip B3
            const B4_TOP_Y = B3_TOP_Y - BASEMENT_H - BASEMENT_GAP;

            const basementPulse = [];

            function createBasementLevel(opts) {
                const g = new THREE.Group();
                const centerY = opts.topY - BASEMENT_H / 2;
                const floorY = opts.topY - BASEMENT_H;

                // Translucent block volume
                const shellGeo = new THREE.BoxGeometry(BASEMENT_W, BASEMENT_H, BASEMENT_D);
                const shell = new THREE.Mesh(
                    shellGeo,
                    new THREE.MeshStandardMaterial({
                        color: opts.color,
                        emissive: opts.color,
                        emissiveIntensity: 0.35,
                        roughness: 0.4,
                        metalness: 0.3,
                        transparent: true,
                        opacity: 0.2,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    })
                );
                shell.position.y = centerY;
                g.add(shell);

                // Glowing block edges
                const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(shellGeo),
                    new THREE.LineBasicMaterial({ color: opts.edgeColor, transparent: true, opacity: 0.9 })
                );
                edges.position.y = centerY;
                g.add(edges);
                basementPulse.push({ mat: edges.material, phase: opts.phase });

                // Floor slab
                const slab = new THREE.Mesh(
                    new THREE.BoxGeometry(BASEMENT_W - 0.2, 0.08, BASEMENT_D - 0.2),
                    new THREE.MeshStandardMaterial({ color: 0x0b1324, roughness: 0.7, metalness: 0.2 })
                );
                slab.position.y = floorY + 0.04;
                g.add(slab);

                // Structural column grid
                const colMat = new THREE.MeshStandardMaterial({ color: PALETTE.precastWarm, roughness: 0.5, metalness: 0.15 });
                [-5.4, -1.8, 1.8, 5.4].forEach((cx) => {
                    [-4.2, 0, 4.2].forEach((cz) => {
                        const col = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.13, 0.13, BASEMENT_H - 0.1, 10),
                            colMat
                        );
                        col.position.set(cx, centerY - 0.01, cz);
                        g.add(col);
                    });
                });

                // Parking bay line markings (two rows each side of the central aisle)
                const bayLineMat = new THREE.MeshBasicMaterial({
                    color: opts.edgeColor,
                    transparent: true,
                    opacity: 0.55
                });
                const bayRows = opts.isShop ? [-2.6] : [-4.6, -2.6, 2.6, 4.6];
                bayRows.forEach((rz) => {
                    for (let x = -BASEMENT_W / 2 + 1.0; x <= BASEMENT_W / 2 - 1.0; x += 0.9) {
                        const line = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 1.7), bayLineMat);
                        line.position.set(x, floorY + 0.09, rz);
                        g.add(line);
                    }
                });

                // Parked car blocks for scale
                const carMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35, metalness: 0.7 });
                const carCount = opts.isShop ? 7 : 14;
                for (let i = 0; i < carCount; i++) {
                    const rz = bayRows[i % bayRows.length];
                    const slot = Math.floor(i / bayRows.length) * 2 + (i % 2);
                    const x = -BASEMENT_W / 2 + 1.45 + slot * 0.9 * 1.5;
                    if (x > BASEMENT_W / 2 - 1.2) continue;
                    const car = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.32, 1.35), carMat);
                    car.position.set(x, floorY + 0.24, rz);
                    g.add(car);
                }

                // Internal vehicle ramp
                const rampLen = 4.0;
                const ramp = new THREE.Mesh(
                    new THREE.BoxGeometry(1.4, 0.08, rampLen),
                    new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6, metalness: 0.3 })
                );
                ramp.rotation.x = Math.atan2(BASEMENT_H - 0.1, rampLen);
                ramp.position.set(BASEMENT_W / 2 - 1.2, centerY, 0);
                g.add(ramp);

                // B2 retail frontage: illuminated shop units along the Asoke (+Z) side
                if (opts.isShop) {
                    const shopGlowMat = new THREE.MeshBasicMaterial({
                        color: PALETTE.goldBright,
                        transparent: true,
                        opacity: 0.55
                    });
                    const shopFrameMat = new THREE.MeshBasicMaterial({ color: opts.edgeColor });
                    const unitW = 1.7;
                    const units = 6;
                    const startX = -((units - 1) * (unitW + 0.25)) / 2;
                    for (let u = 0; u < units; u++) {
                        const ux = startX + u * (unitW + 0.25);
                        const front = new THREE.Mesh(
                            new THREE.BoxGeometry(unitW, BASEMENT_H * 0.62, 0.1),
                            shopGlowMat
                        );
                        front.position.set(ux, floorY + BASEMENT_H * 0.36, 2.6);
                        g.add(front);

                        const sign = new THREE.Mesh(new THREE.BoxGeometry(unitW, 0.07, 0.12), shopFrameMat);
                        sign.position.set(ux, floorY + BASEMENT_H * 0.72, 2.62);
                        g.add(sign);
                    }
                }

                // Floating level tag (B1 / B2)
                const tag = createLabelSprite(opts.label, opts.labelCss);
                tag.position.set(BASEMENT_W / 2 + 1.5, centerY, BASEMENT_D / 2 - 0.5);
                g.add(tag);

                return g;
            }

            const b1Group = createBasementLevel({
                topY: B1_TOP_Y,
                color: PALETTE.b1Blue,
                edgeColor: PALETTE.b1BlueEdge,
                label: 'B1',
                labelCss: '#7fa2ff',
                isShop: false,
                phase: 0
            });
            scene.add(b1Group);

            const b2Group = createBasementLevel({
                topY: B2_TOP_Y,
                color: PALETTE.b2Green,
                edgeColor: PALETTE.b2GreenEdge,
                label: 'B2',
                labelCss: '#5ee0a8',
                isShop: true,
                phase: Math.PI
            });
            scene.add(b2Group);

            const b3Group = createBasementLevel({
                topY: B3_TOP_Y,
                color: PALETTE.b3Amber,
                edgeColor: PALETTE.b3AmberEdge,
                label: 'B3',
                labelCss: '#fcd34d',
                isShop: false,
                phase: Math.PI * 1.5
            });
            scene.add(b3Group);

            const b4Group = createBasementLevel({
                topY: B4_TOP_Y,
                color: PALETTE.b4Violet,
                edgeColor: PALETTE.b4VioletEdge,
                label: 'B4',
                labelCss: '#c4b5fd',
                isShop: false,
                phase: Math.PI / 2
            });
            scene.add(b4Group);

            // ==========================================
            // 6. DUAL-ACCESS ROAD RIBBONS (SUKHUMVIT 21 ASOKE & SUKHUMVIT 23)
            // ==========================================
            const roadsGroup = new THREE.Group();
            scene.add(roadsGroup);

            const roadLength = 96;
            const asokeZ = 10.2;       // Front: Sukhumvit 21 (Asoke Montri Road)
            const sukhumvit23Z = -9.6; // Rear: Sukhumvit 23

            function createRoadRibbon(zPos, width, primaryColor) {
                const group = new THREE.Group();

                // Dark sleek asphalt deck
                const roadGeo = new THREE.BoxGeometry(roadLength, 0.12, width);
                const roadMat = new THREE.MeshStandardMaterial({
                    color: 0x071022,
                    roughness: 0.4,
                    metalness: 0.6
                });
                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.position.set(0, BASE_Y - 0.35, zPos);
                group.add(roadMesh);

                // Glowing road edge curbs
                [-width / 2, width / 2].forEach((edgeZ) => {
                    const curbGeo = new THREE.BoxGeometry(roadLength, 0.16, 0.12);
                    const curbMat = new THREE.MeshBasicMaterial({
                        color: primaryColor,
                        transparent: true,
                        opacity: 0.65
                    });
                    const curb = new THREE.Mesh(curbGeo, curbMat);
                    curb.position.set(0, BASE_Y - 0.3, zPos + edgeZ);
                    group.add(curb);
                });

                // Center median divider line
                const medianGeo = new THREE.BoxGeometry(roadLength, 0.14, 0.08);
                const medianMat = new THREE.MeshBasicMaterial({
                    color: PALETTE.goldBright,
                    transparent: true,
                    opacity: 0.45
                });
                const median = new THREE.Mesh(medianGeo, medianMat);
                median.position.set(0, BASE_Y - 0.3, zPos);
                group.add(median);

                return group;
            }

            // Add Sukhumvit 21 (Wide 4-lane avenue in front) & Sukhumvit 23 (2-lane street in rear)
            roadsGroup.add(createRoadRibbon(asokeZ, 4.6, PALETTE.cyanBright));
            roadsGroup.add(createRoadRibbon(sukhumvit23Z, 3.0, PALETTE.royalLight));

            // Connecting Driveway Link Ramps from Roads to GMM Grammy Place Podium
            const drivewayMat = new THREE.MeshStandardMaterial({
                color: 0x0b1930,
                roughness: 0.35,
                metalness: 0.5
            });
            const frontDriveway = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.14, 3.4), drivewayMat);
            frontDriveway.position.set(0, BASE_Y - 0.32, 6.8);
            roadsGroup.add(frontDriveway);

            const rearDriveway = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.14, 3.2), drivewayMat);
            rearDriveway.position.set(0, BASE_Y - 0.32, -6.6);
            roadsGroup.add(rearDriveway);

            // Animated Traffic Light Trails on Sukhumvit 21 & Sukhumvit 23
            const trafficStreaks = [];
            const streakDefs = [
                // Sukhumvit 21 (Asoke) Lanes
                { z: asokeZ - 1.3, dir: 1, speed: 14, color: PALETTE.goldBright, len: 3.6, count: 6 },
                { z: asokeZ - 0.55, dir: 1, speed: 18, color: PALETTE.cyanBright, len: 4.2, count: 5 },
                { z: asokeZ + 0.55, dir: -1, speed: 16, color: PALETTE.ruby, len: 3.8, count: 6 },
                { z: asokeZ + 1.3, dir: -1, speed: 13, color: PALETTE.goldBright, len: 3.2, count: 5 },
                // Sukhumvit 23 Rear Lanes
                { z: sukhumvit23Z - 0.7, dir: 1, speed: 11, color: PALETTE.cyanBright, len: 2.8, count: 4 },
                { z: sukhumvit23Z + 0.7, dir: -1, speed: 12, color: PALETTE.ruby, len: 3.0, count: 4 }
            ];

            streakDefs.forEach((lane) => {
                const mat = new THREE.MeshBasicMaterial({
                    color: lane.color,
                    transparent: true,
                    opacity: 0.88
                });
                for (let i = 0; i < lane.count; i++) {
                    const streakGeo = new THREE.BoxGeometry(lane.len, 0.12, 0.18);
                    const streakMesh = new THREE.Mesh(streakGeo, mat);
                    const startX = -roadLength / 2 + (i / lane.count) * roadLength + (Math.random() - 0.5) * 6;
                    streakMesh.position.set(startX, BASE_Y - 0.2, lane.z);
                    roadsGroup.add(streakMesh);

                    trafficStreaks.push({
                        mesh: streakMesh,
                        dir: lane.dir,
                        speed: lane.speed * (0.9 + Math.random() * 0.25),
                        limit: roadLength / 2
                    });
                }
            });

            // ==========================================
            // 7. ORBITAL RINGS & ARCHITECTURAL HORIZON GRID
            // ==========================================
            const archGroup = new THREE.Group();
            scene.add(archGroup);

            const rings = [];
            const ringConfigs = [
                { radius: 13.5, tube: 0.04, color: PALETTE.cyanBright, opacity: 0.36, tiltX: 0.32, tiltZ: 0.1, speed: 0.11 },
                { radius: 18.5, tube: 0.035, color: PALETTE.royalLight, opacity: 0.28, tiltX: -0.22, tiltZ: 0.22, speed: -0.07 },
                { radius: 24.0, tube: 0.045, color: PALETTE.goldBright, opacity: 0.25, tiltX: 0.16, tiltZ: -0.18, speed: 0.045 },
                { radius: 30.0, tube: 0.03, color: PALETTE.ruby, opacity: 0.18, tiltX: -0.1, tiltZ: 0.14, speed: -0.035 }
            ];

            ringConfigs.forEach((cfg) => {
                const ringGeo = new THREE.TorusGeometry(cfg.radius, cfg.tube, 12, 120);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: cfg.opacity
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2 + cfg.tiltX;
                ringMesh.rotation.y = cfg.tiltZ;
                archGroup.add(ringMesh);
                rings.push({ mesh: ringMesh, speed: cfg.speed, baseTiltX: ringMesh.rotation.x });
            });

            // Subtle Lower Architectural Horizon Grid aligned with Ground Level
            const gridHelper = new THREE.GridHelper(96, 48, PALETTE.cyanPrimary, PALETTE.royalDeep);
            gridHelper.position.y = BASE_Y - 0.42;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.18;
            scene.add(gridHelper);

            // ==========================================
            // 8. FLOATING 3D GEOMETRIC CRYSTALS / DIAMONDS
            // ==========================================
            const crystalsGroup = new THREE.Group();
            scene.add(crystalsGroup);
            const crystals = [];

            const crystalCount = 34;
            for (let i = 0; i < crystalCount; i++) {
                const theme = CRYSTAL_THEMES[i % CRYSTAL_THEMES.length];
                const isDiamond = i % 3 !== 0;

                const baseSize = 0.5 + Math.random() * 1.05;
                const geo = isDiamond
                    ? new THREE.OctahedronGeometry(baseSize, 0)
                    : new THREE.IcosahedronGeometry(baseSize * 0.9, 0);

                if (isDiamond) {
                    geo.scale(1, 1.45 + Math.random() * 0.35, 1);
                }

                const mat = new THREE.MeshStandardMaterial({
                    color: theme.core,
                    emissive: theme.emissive,
                    emissiveIntensity: 0.65,
                    roughness: 0.15,
                    metalness: 0.85,
                    transparent: true,
                    opacity: 0.78,
                    flatShading: true
                });

                const crystalUnit = new THREE.Group();
                const coreMesh = new THREE.Mesh(geo, mat);
                crystalUnit.add(coreMesh);

                const edgeGeo = new THREE.EdgesGeometry(geo);
                const edgeMat = new THREE.LineBasicMaterial({
                    color: theme.edge,
                    transparent: true,
                    opacity: 0.85
                });
                const edgeWire = new THREE.LineSegments(edgeGeo, edgeMat);
                edgeWire.scale.setScalar(1.03);
                crystalUnit.add(edgeWire);

                // Keep crystals outside the immediate building envelope (radius >= 10.5)
                const orbitRadius = 10.5 + Math.random() * 23;
                const orbitAngle = Math.random() * Math.PI * 2;
                const baseY = (Math.random() - 0.42) * 26;

                crystalUnit.position.set(
                    Math.cos(orbitAngle) * orbitRadius,
                    baseY,
                    Math.sin(orbitAngle) * orbitRadius
                );

                crystalUnit.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                crystalsGroup.add(crystalUnit);

                crystals.push({
                    group: crystalUnit,
                    orbitRadius: orbitRadius,
                    orbitAngle: orbitAngle,
                    orbitSpeed: (0.025 + Math.random() * 0.07) * (i % 2 === 0 ? 1 : -1),
                    baseY: baseY,
                    bobSpeed: 0.8 + Math.random() * 1.4,
                    bobOffset: Math.random() * Math.PI * 2,
                    bobAmplitude: 0.6 + Math.random() * 1.2,
                    rotSpeedX: (Math.random() - 0.5) * 0.8,
                    rotSpeedY: (Math.random() - 0.5) * 1.1,
                    rotSpeedZ: (Math.random() - 0.5) * 0.6
                });
            }

            // ==========================================
            // 9. SOFT FLOATING LIGHT ORBS & PARTICLE FIELD
            // ==========================================
            const orbsGroup = new THREE.Group();
            scene.add(orbsGroup);
            const orbs = [];

            const orbColors = [
                PALETTE.cyanBright,
                PALETTE.cyanPrimary,
                PALETTE.royalLight,
                PALETTE.goldBright,
                PALETTE.ruby
            ];
            const orbTextures = orbColors.map(c => createGlowTexture(c));

            const orbCount = 24;
            for (let i = 0; i < orbCount; i++) {
                const tex = orbTextures[i % orbTextures.length];
                const spriteMat = new THREE.SpriteMaterial({
                    map: tex,
                    transparent: true,
                    opacity: 0.55 + Math.random() * 0.35,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const sprite = new THREE.Sprite(spriteMat);
                const baseScale = 2.2 + Math.random() * 4.0;
                sprite.scale.set(baseScale, baseScale, 1);

                const radius = 9 + Math.random() * 26;
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.42) * 26;

                sprite.position.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );

                orbsGroup.add(sprite);

                orbs.push({
                    sprite: sprite,
                    baseScale: baseScale,
                    radius: radius,
                    angle: angle,
                    orbitSpeed: (0.02 + Math.random() * 0.055) * (i % 2 === 0 ? -1 : 1),
                    baseY: y,
                    bobSpeed: 0.6 + Math.random() * 1.2,
                    bobOffset: Math.random() * Math.PI * 2,
                    pulseSpeed: 1.2 + Math.random() * 2.0
                });
            }

            const particleCount = 420;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorChoices = [
                new THREE.Color(PALETTE.cyanBright),
                new THREE.Color(PALETTE.cyanPrimary),
                new THREE.Color(PALETTE.royalLight),
                new THREE.Color(PALETTE.goldBright),
                new THREE.Color(PALETTE.ruby)
            ];

            for (let i = 0; i < particleCount; i++) {
                const r = 8 + Math.random() * 38;
                const theta = Math.random() * Math.PI * 2;
                const ySpread = (Math.random() - 0.5) * 44;

                positions[i * 3] = Math.cos(theta) * r;
                positions[i * 3 + 1] = ySpread;
                positions[i * 3 + 2] = Math.sin(theta) * r;

                const chosenColor = colorChoices[Math.floor(Math.random() * colorChoices.length)];
                colors[i * 3] = chosenColor.r;
                colors[i * 3 + 1] = chosenColor.g;
                colors[i * 3 + 2] = chosenColor.b;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleTexture = createGlowTexture(0xffffff);
            const particleMat = new THREE.PointsMaterial({
                size: 0.65,
                map: particleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            // ==========================================
            // 10. LAYER LEGEND TOGGLES (6 ITEMS)
            // ==========================================
            const LAYERS = {
                tower: buildingGroup,
                ground: groundGroup,
                b1: b1Group,
                b2: b2Group,
                b3: b3Group,
                b4: b4Group
            };

            document.querySelectorAll('.legend-item').forEach((item) => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const layer = LAYERS[item.dataset.layer];
                    if (!layer) return;
                    layer.visible = !layer.visible;
                    item.setAttribute('aria-pressed', layer.visible ? 'true' : 'false');
                });
            });

            // ==========================================
            // 11. INTERACTIVE CAMERA PRESETS, PARALLAX & DRAG-TO-ORBIT
            // ==========================================
            let isDragging = false;
            let autoOrbit = true;
            let prevPointerX = 0;
            let prevPointerY = 0;

            // Spherical camera coordinates & target lookAt height
            let targetTheta = 0.52;
            let currentTheta = 0.52;
            let targetPhi = 0.22;
            let currentPhi = 0.22;
            let cameraDistance = 36;
            let targetDistance = 36;
            let currentLookAtY = 0.5;
            let targetLookAtY = 0.5;

            let pointerNormX = 0;
            let pointerNormY = 0;

            // Camera View Preset Definitions (5 views)
            const CAMERA_PRESETS = {
                asoke: {
                    theta: 0.22,
                    phi: 0.14,
                    distance: 31,
                    lookAtY: -0.5,
                    orbit: false
                },
                sukhumvit23: {
                    theta: Math.PI - 0.28,
                    phi: 0.18,
                    distance: 32,
                    lookAtY: -0.5,
                    orbit: false
                },
                helipad: {
                    theta: 0.65,
                    phi: 0.72,
                    distance: 21,
                    lookAtY: 9.8,
                    orbit: false
                },
                basement: {
                    theta: 1.42,
                    phi: -0.1,
                    distance: 28,
                    lookAtY: B3_TOP_Y + BASEMENT_GAP / 2,
                    orbit: false
                },
                orbit: {
                    theta: currentTheta,
                    phi: 0.22,
                    distance: 36,
                    lookAtY: 0.5,
                    orbit: true
                }
            };

            const pillButtons = document.querySelectorAll('.camera-pill');

            function setActivePill(viewKey) {
                pillButtons.forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.view === viewKey);
                });
            }

            pillButtons.forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const viewKey = btn.dataset.view;
                    const preset = CAMERA_PRESETS[viewKey];
                    if (!preset) return;

                    setActivePill(viewKey);
                    autoOrbit = preset.orbit;

                    if (viewKey !== 'orbit') {
                        // Shortest angular path for smooth transition
                        const twoPi = Math.PI * 2;
                        const normalizedCurrent = ((currentTheta % twoPi) + twoPi) % twoPi;
                        let diff = preset.theta - normalizedCurrent;
                        if (diff > Math.PI) diff -= twoPi;
                        if (diff < -Math.PI) diff += twoPi;
                        targetTheta = currentTheta + diff;
                    }
                    targetPhi = preset.phi;
                    targetDistance = preset.distance;
                    targetLookAtY = preset.lookAtY;
                });
            });

            function onPointerDown(clientX, clientY) {
                isDragging = true;
                prevPointerX = clientX;
                prevPointerY = clientY;
            }

            function onPointerMove(clientX, clientY) {
                pointerNormX = (clientX / window.innerWidth) * 2 - 1;
                pointerNormY = -(clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = clientX - prevPointerX;
                    const deltaY = clientY - prevPointerY;

                    targetTheta -= deltaX * 0.006;
                    targetPhi = Math.max(-0.35, Math.min(0.95, targetPhi + deltaY * 0.005));

                    prevPointerX = clientX;
                    prevPointerY = clientY;
                }
            }

            function onPointerUp() {
                isDragging = false;
            }

            // Ignore drags that start on the UI overlays (pills & legend)
            const UI_SELECTOR = '.camera-pills, .layer-legend';

            // Mouse Listeners
            window.addEventListener('mousedown', (e) => {
                if (e.target.closest(UI_SELECTOR)) return;
                onPointerDown(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('mouseleave', onPointerUp);

            // Touch Listeners for Mobile/Tablet
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest(UI_SELECTOR)) return;
                if (e.touches.length === 1) {
                    onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', onPointerUp);

            // Smooth Wheel Zoom
            window.addEventListener('wheel', (e) => {
                targetDistance = Math.max(17, Math.min(54, targetDistance + e.deltaY * 0.018));
            }, { passive: true });

            // ==========================================
            // 12. ANIMATION LOOP & RESPONSIVE RESIZE
            // ==========================================
            const clock = new THREE.Clock();
            let prevTime = 0;

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();
                const deltaTime = elapsedTime - prevTime;
                prevTime = elapsedTime;

                // Gentle continuous orbit when Auto Orbit is active and not dragging
                if (autoOrbit && !isDragging) {
                    targetTheta += deltaTime * 0.055;
                }

                // Smooth damping for camera rotation, zoom & vertical target
                currentTheta += (targetTheta - currentTheta) * 0.06;
                currentPhi += (targetPhi - currentPhi) * 0.06;
                cameraDistance += (targetDistance - cameraDistance) * 0.06;
                currentLookAtY += (targetLookAtY - currentLookAtY) * 0.06;

                // Compute camera position with subtle cursor parallax shift
                const parallaxX = pointerNormX * 1.8;
                const parallaxY = pointerNormY * 1.2;

                camera.position.x = cameraDistance * Math.sin(currentTheta) * Math.cos(currentPhi) + parallaxX;
                camera.position.y = currentLookAtY + cameraDistance * Math.sin(currentPhi) + parallaxY;
                camera.position.z = cameraDistance * Math.cos(currentTheta) * Math.cos(currentPhi);
                camera.lookAt(0, currentLookAtY, 0);

                // Subtle pulse on highlighted strategic floors (25, 26, 30, 31, etc.)
                animatedFloorRings.forEach((item) => {
                    item.mesh.material.opacity = 0.65 + Math.sin(elapsedTime * 2.4 + item.phase) * 0.3;
                });

                // Gentle alternating pulse on B1–B4 block edges
                basementPulse.forEach((b) => {
                    b.mat.opacity = 0.6 + 0.3 * Math.sin(elapsedTime * 1.6 + b.phase);
                });

                // Pulse Rooftop Helipad Perimeter & Spire Beacons
                helipadBeacons.forEach((b) => {
                    const pulse = 0.55 + 0.45 * Math.sin(elapsedTime * (b.isRuby ? 4.2 : 2.6) + b.phase);
                    b.sprite.material.opacity = pulse;
                });

                // Animate Dual-Access Road Traffic Light Trails (Sukhumvit 21 & Sukhumvit 23)
                trafficStreaks.forEach((s) => {
                    s.mesh.position.x += s.dir * s.speed * deltaTime;
                    if (s.dir > 0 && s.mesh.position.x > s.limit) {
                        s.mesh.position.x = -s.limit;
                    } else if (s.dir < 0 && s.mesh.position.x < -s.limit) {
                        s.mesh.position.x = s.limit;
                    }
                });

                // Animate Architectural Gyroscopic Rings
                archGroup.rotation.y = elapsedTime * 0.035;
                rings.forEach((r, idx) => {
                    r.mesh.rotation.z = elapsedTime * r.speed;
                    r.mesh.rotation.x = r.baseTiltX + Math.sin(elapsedTime * 0.4 + idx) * 0.08;
                });

                // Animate Floating Crystals / Diamonds
                crystals.forEach((c) => {
                    c.orbitAngle += c.orbitSpeed * deltaTime;
                    c.group.position.x = Math.cos(c.orbitAngle) * c.orbitRadius;
                    c.group.position.z = Math.sin(c.orbitAngle) * c.orbitRadius;
                    c.group.position.y = c.baseY + Math.sin(elapsedTime * c.bobSpeed + c.bobOffset) * c.bobAmplitude;

                    c.group.rotation.x += c.rotSpeedX * deltaTime;
                    c.group.rotation.y += c.rotSpeedY * deltaTime;
                    c.group.rotation.z += c.rotSpeedZ * deltaTime;
                });

                // Animate Floating Light Orbs
                orbs.forEach((o) => {
                    o.angle += o.orbitSpeed * deltaTime;
                    o.sprite.position.x = Math.cos(o.angle) * o.radius;
                    o.sprite.position.z = Math.sin(o.angle) * o.radius;
                    o.sprite.position.y = o.baseY + Math.sin(elapsedTime * o.bobSpeed + o.bobOffset) * 1.1;

                    const pulse = 1 + Math.sin(elapsedTime * o.pulseSpeed + o.bobOffset) * 0.22;
                    o.sprite.scale.set(o.baseScale * pulse, o.baseScale * pulse, 1);
                });

                // Slowly swirl particle field
                particleSystem.rotation.y = -elapsedTime * 0.022;
                particleSystem.position.y = Math.sin(elapsedTime * 0.35) * 0.8;

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        };
    </script>
</body>
</html>
